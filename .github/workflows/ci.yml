name: CI

# ด่านคุณภาพ (ตามแผน AI Business OS §6):
#   T0 = เร็ว ไม่ต่อ DB ไม่ต่อเน็ต → ทุก push/PR (ต้องผ่านเสมอ)
#   T1 = ต้องใช้ Neon จริง → ทุก PR (ข้ามอัตโนมัติถ้ายังไม่ได้ตั้ง secret)
#
# ทำไมต้องมี: ก่อนหน้านี้ไม่มี CI เลย — กฎ "107/107 ก่อน deploy" เป็นแค่ประโยคใน _RESUME.md
# ที่อาศัยความจำของคน. ไฟล์นี้เปลี่ยนมันเป็นฟิสิกส์

# ค่าใช้จ่าย (2026-07-30): เดือน ก.ค. รีโปนี้ใช้ ~2,700 runner-นาที ($15.13) จาก 340 รอบ —
# 88% เป็น T1 (QC บน Neon) ที่รันครบทุกชุดในทุก push แม้ push นั้นแก้แค่เอกสาร
# → push ที่แตะแค่ .md/docs/ledger ไม่รันเลย (paths-ignore ข้างล่าง) = ตัวลดค่าใช้จ่ายหลัก
#
# 🔴 21 ส.ค. 2026 — T1 เปลี่ยนเป็น `pnpm qc:all` (ทุกชุดใน scripts/qc-*.mts) ตามคำสั่งเจ้าของ
# เหตุ (จริง 19 ส.ค.): CI เดิมเลือกชุดมาด้วยมือ — push รันแค่ 3 ชุด · PR รันแค่ 11 ชุด
# จาก 152 ชุดที่มีในรีโป → ชุดที่เหลือ (รวม qc-hardening/qc-pdpa/qc-public-api/qc-kernel-guard)
# **ไม่เคยเป็นด่านเลย** และพบ 2 ชุดแดงค้างมาเป็นสัปดาห์โดยไม่มีใครรู้
# ตอนนี้ด่าน = "ทุกชุดที่มีในโฟลเดอร์" ไม่ใช่ "ชุดที่ใครสักคนจำได้ว่าต้องใส่"
# → ข้อสอบใหม่เข้าเป็นด่านอัตโนมัติตั้งแต่วินาทีที่ไฟล์ถูกสร้าง ไม่ต้องมาแก้ไฟล์นี้อีก
#
# 🔴 รอบแรกพลาด — จดไว้กันทำซ้ำ: ตอนแรกรัน qc:all ทั้ง 152 ชุดในงานเดียว timeout 45 นาที
# ประเมินจากเวลาเครื่อง dev (8 นาที) แล้วเผื่อ 5 เท่า **ยังไม่พอ** → ถูกตัดจบเปล่า 2 รอบ
# ของจริงคือ runner ช้ากว่าเครื่อง dev ~10 เท่า เพราะ DB อยู่ ap-southeast-1 แต่ runner อยู่ US
# (วัดตรง ๆ: qc:account 18 วิ บนเครื่อง → 195 วิ บน CI) → 152 ชุด ≈ 92 นาที
# **บทเรียน: อย่าประเมินเวลา CI จากเวลาเครื่อง dev เมื่อ workload เป็น latency-bound**
# → แก้เป็นซอย 6 ส่วนรันขนาน (`qc:all --shard=i/6`) ส่วนละ ~26 ชุด ≈ 15-20 นาที
#   ครอบคลุมเท่าเดิม 152/152 · Neon compute-time รวมเท่าเดิม · runner ฟรี (รีโป public)
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'ledger/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t0:
    name: T0 — typecheck + fitness (ไม่ต่อ DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: prisma generate
        run: pnpm exec prisma generate
      - name: typecheck
        run: pnpm typecheck
      - name: fitness (F2/F5/F7/F8/F9 — กันสถาปัตยกรรม/เอกสารเน่า)
        run: pnpm fitness

  t1:
    name: T1 — ข้อสอบ ${{ matrix.shard }}/6 บน Neon branch
    runs-on: ubuntu-latest
    needs: t0
    # 🔴 วัดจริง 21 ส.ค. 2026: บน runner ข้อสอบช้ากว่าเครื่อง dev ~10 เท่า
    # (qc:account 18 วิ บนเครื่อง → 195 วิ บน CI) เพราะ DB อยู่ ap-southeast-1 แต่ runner อยู่ US
    # → รันเรียง 152 ชุดในงานเดียว = ~92 นาที · ทะลุ timeout ตัดจบเปล่า 2 รอบ (run 32442205050 / 32444463505)
    # → ซอย 6 ส่วนรันขนาน · ส่วนละ ~26 ชุด ≈ 15-20 นาที · ครอบคลุมเท่าเดิม 152/152
    # Neon compute-time รวมเท่าเดิม (งานเท่าเดิม แค่ขนาน) · runner ฟรีเพราะรีโปเป็น public
    strategy:
      fail-fast: false # ส่วนอื่นต้องรันต่อให้จบ — อยากเห็นทุกชุดที่แดงในรอบเดียว ไม่ใช่ตัวแรกแล้วหยุด
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ยังไม่ได้ตั้ง NEON_API_KEY → ข้ามแทนที่จะแดง (แต่บอกให้ชัดว่าข้าม)
      - name: ตรวจ secret
        id: guard
        run: |
          if [ -z "${{ secrets.NEON_API_KEY }}" ] || [ -z "${{ secrets.NEON_PROJECT_ID }}" ]; then
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::warning::ข้าม T1 — ยังไม่ได้ตั้ง secret NEON_API_KEY/NEON_PROJECT_ID (ดู docs/10_OPERATIONS.md)"
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      # 1 run = 1 Neon branch → ไม่มี global mutation, รันขนานได้
      # ใช้สคริปต์ของเราเอง (scripts/neon-branch.mts — ทดสอบกับของจริงแล้ว มีด่านกัน production)
      # แทน neondatabase/create-branch-action ที่ตาย "Multiple roles found" แม้ระบุ role (run #5,#6)
      - name: สร้าง Neon branch
        if: steps.guard.outputs.ready == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          pnpm exec tsx scripts/neon-branch.mts create ci-${{ github.run_id }}-s${{ matrix.shard }} | tee branch.out
          # CI ใช้ direct ทั้งคู่ — pooler มีไว้เพื่อ serverless concurrency ซึ่ง CI ไม่ต้องใช้
          # และ pgbouncer บน endpoint เย็น ๆ เคยทำ FK violation ปริศนาใน interactive tx (run #8:
          # ensureAccounting ที่ทุกอย่างอยู่ใน tx เดียว ยัง FK พัง — ทำซ้ำบนเครื่องไม่ได้)
          DIRECT=$(grep -E '^DIRECT_URL=' branch.out | cut -d= -f2-)
          echo "DIRECT_URL=$DIRECT" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$DIRECT" >> "$GITHUB_ENV"
          # 🔴 ต้องยาว ≥ 32 ตัวอักษร — src/lib/env.ts บังคับ z.string().min(32) แล้ว throw ตอน import
          # ของเดิมยาว 25 → ทุกชุดที่แตะ session พังตั้งแต่ boot (ซ่อนอยู่นาน เพราะ CI เดิมรันแค่ 3 ชุดที่ไม่แตะ)
          echo "SESSION_SECRET=ci-only-not-a-real-secret-do-not-use-anywhere" >> "$GITHUB_ENV"
          # ค่าปลอมล้วน — ไม่ตั้ง = route google ตอบ 503 "google_disabled" แล้วข้อสอบ MA-12.2
          # (token ปลอมต้องโดนปฏิเสธ 401) วัดไม่ได้เลย · ค่านี้ทำให้เส้นทาง verify ทำงานจริง
          # ไม่ใช่ความลับ ไม่ผูกกับบัญชี Google ของเรา
          echo "GOOGLE_WEB_CLIENT_ID=ci-dummy-not-a-real-client.apps.googleusercontent.com" >> "$GITHUB_ENV"

      - name: อุ่นเครื่อง DB (Neon compute เพิ่งเกิด — รอพร้อมจริงก่อนยิงชุดเทสต์)
        if: steps.guard.outputs.ready == 'true'
        run: pnpm exec tsx scripts/db-warmup.mts

      - name: migrate deploy
        if: steps.guard.outputs.ready == 'true'
        run: pnpm exec prisma migrate deploy

      - name: drift check (DB ต้องตรงกับ schema)
        if: steps.guard.outputs.ready == 'true'
        run: pnpm drift

      # ด่านเดียว = ข้อสอบทุกชุดในโฟลเดอร์ (qc-all.mts อ่าน scripts/qc-*.mts เอง)
      # ห้ามกลับไปไล่ชื่อชุดทีละบรรทัดที่นี่อีก — นั่นคือต้นเหตุที่ 89 ชุดตกสำรวจมาก่อน
      # ชุดไหนแดง แสดงชื่อในตารางสรุปท้าย log + บรรทัด JSON_SUMMARY
      - name: ข้อสอบส่วนที่ ${{ matrix.shard }}/6 (qc:all --shard)
        if: steps.guard.outputs.ready == 'true'
        run: pnpm qc:all --shard=${{ matrix.shard }}/6

      - name: ลบ Neon branch (กันค่าใช้จ่ายบาน)
        if: always() && steps.guard.outputs.ready == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: pnpm exec tsx scripts/neon-branch.mts delete ci-${{ github.run_id }}-s${{ matrix.shard }} || true
